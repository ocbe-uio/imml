# This workflow will install Python dependencies and run tests with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  build:
    if: ${{ github.actor != 'nektos/act' }}
    runs-on: ${{matrix.os}}
    continue-on-error: true
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.22"
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: |
        uv pip install .
    - name: Install tests
      run: |
        uv pip install ".[tests]"
    - name: Test base
      run: |
        uv run pytest --cov=imml
    - name: Test linux
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y wget ca-certificates
        wget -qO- https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc | sudo tee -a /etc/apt/trusted.gpg.d/cran_ubuntu_key.asc > /dev/null
        sudo add-apt-repository "deb https://cloud.r-project.org/bin/linux/ubuntu $(lsb_release -cs)-cran40/"
        sudo apt install -y libtirpc-dev #needed for rpy2
        sudo apt install r-base -y
        sudo apt install octave -y
        sudo apt install octave-control octave-statistics -y
        sudo Rscript -e "install.packages(c('nnTensor', 'SNFtool'))"
    - name: Test windows
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        choco install octave -y
        set "PATH=%PATH%;C:\Program Files\Git\usr\bin"
        octave --eval "pkg install -forge control; pkg install -forge statistics; disp('Packages installed successfully.')"
        Rscript -e "install.packages(c('nnTensor', 'SNFtool'), repos='http://cran.r-project.org')"
    - name: Test mac
      if: runner.os == 'macOS'
      run: |
        brew update
        brew reinstall gcc
        brew reinstall gfortran
        echo "/opt/homebrew/bin" >> $GITHUB_PATH
        brew install texinfo || true
        brew link --overwrite texinfo
        brew postinstall texinfo || true
        brew install --cask r || brew install r
        brew install octave
        curl -L https://github.com/gnu-octave/pkg-control/releases/download/control-4.1.3/control-4.1.3.tar.gz -o control.tar.gz
        curl -L https://github.com/gnu-octave/statistics/releases/download/release-1.7.7/statistics-1.7.7.tar.gz -o statistics.tar.gz
        octave --eval 'pkg install control.tar.gz'
        octave --eval 'pkg install statistics.tar.gz'
        octave --eval 'pkg load control; pkg load statistics; ver'
        Rscript -e "install.packages(c('nnTensor', 'SNFtool'), repos='http://cran.r-project.org')"
        brew install xquartz
    - name: Test r
      run: |
        uv pip install ".[r]"
        uv run pytest --cov=imml
    - name: Test octave
      if: runner.os != 'Windows'
      run: |
        uv pip install ".[octave]"
        uv run pytest --cov=imml
    - name: Test deep
      if: runner.os != 'Windows'
      run: |
        uv pip install ".[deep]"
        uv run pytest --cov=imml --cov-report=term --cov-report json
    - name: Test docs
      run: |
        uv pip install ".[docs]"
    - name: Upload coverage reports to Codecov
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: ocbe-uio/imml