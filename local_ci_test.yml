# This workflow will install Python dependencies and run tests with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
# Run locally with the command:
# act -W local_ci_test.yml --rm --artifact-server-path ./artifacts; rm -rf ~/.cache/act;
# docker volume ls | awk '/act/ {print $2}' | xargs -r docker volume rm; docker stop $(docker ps -q); docker system prune -a --volumes

name: Local CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  UV_SYSTEM_PYTHON: 1
  PIP_BREAK_FLAG: ${{ runner.os == 'macOS' && (matrix.python-version == '3.13' || matrix.python-version == '3.14') && '--break-system-packages' || '' }}

jobs:
  build-local:
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ${{matrix.os}}
    continue-on-error: true
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        clean: true
        sparse-checkout: |
          imml
          pyproject.toml
          tests
        sparse-checkout-cone: true
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      run: |
        pip install uv
    - name: Remove rpy2
      run: |
        python - <<'PY'
        import importlib.util, subprocess, sys
        if importlib.util.find_spec('rpy2') is not None:
            print("rpy2 detected; uninstalling...")
            subprocess.run([sys.executable, "-m", "pip", "uninstall", "-y", "rpy2"], check=False)
        else:
            print("rpy2 not installed; nothing to do.")
        PY
    - name: Install dependencies
      run: |
        uv pip install . $PIP_BREAK_FLAG
    - name: Install tests
      run: |
        uv pip install ".[tests]" $PIP_BREAK_FLAG
    - name: Prepare report directory
      run: |
        python - <<'PY'
        import os
        os.makedirs("reports", exist_ok=True)
        PY
    - name: Test base
      run: |
        uv run pytest --cov=imml \
               --cov-report=term \
               --cov-report=html:reports/htmlcov-base \
               --cov-report=xml:reports/coverage-base.xml
    - name: Test linux
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y wget ca-certificates
        wget -qO- https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc | sudo tee -a /etc/apt/trusted.gpg.d/cran_ubuntu_key.asc > /dev/null
        sudo add-apt-repository -y "deb https://cloud.r-project.org/bin/linux/ubuntu $(lsb_release -cs)-cran40/"
        sudo apt-get update
        sudo apt-get install -y libtirpc-dev #needed for rpy2
        sudo apt-get install -y r-base
        sudo apt-get install -y octave
        sudo apt-get install -y octave-control octave-statistics
        sudo Rscript -e "install.packages(c('nnTensor', 'SNFtool'), repos='https://cloud.r-project.org')"
    - name: Test windows
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        choco install octave -y
        set "PATH=%PATH%;C:\Program Files\Git\usr\bin"
        octave --eval "pkg install -forge control; pkg install -forge statistics; disp('Packages installed successfully.')"
        Rscript -e "install.packages(c('nnTensor', 'SNFtool'), repos='http://cran.r-project.org')"
    - name: Test mac
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install gcc
        brew doctor
        brew cleanup
        brew install texinfo || true
        brew link --overwrite texinfo
        brew postinstall texinfo || true
        brew install --cask r || brew install r
        brew install octave
        curl -L https://github.com/gnu-octave/pkg-control/releases/download/control-4.1.3/control-4.1.3.tar.gz -o control.tar.gz
        curl -L https://github.com/gnu-octave/statistics/releases/download/release-1.7.7/statistics-1.7.7.tar.gz -o statistics.tar.gz
        octave --eval 'pkg install control.tar.gz'
        octave --eval 'pkg install statistics.tar.gz'
        octave --eval 'pkg load control; pkg load statistics; ver'
        Rscript -e "install.packages(c('nnTensor', 'SNFtool'), repos='http://cran.r-project.org')"
        brew install xquartz
    - name: Test r
      run: |
        uv pip install ".[r]" $PIP_BREAK_FLAG
        uv run pytest --cov=imml \
               --cov-report=html:reports/htmlcov-r \
               --cov-report=xml:reports/coverage-r.xml
    - name: Test octave
      if: runner.os != 'Windows'
      run: |
        uv pip install ".[octave]" $PIP_BREAK_FLAG
        uv run pytest --cov=imml \
               --cov-report=term \
               --cov-report=html:reports/htmlcov-octave \
               --cov-report=xml:reports/coverage-octave.xml
    - name: Test deep
      if: runner.os != 'Windows'
      run: |
        uv pip install ".[deep]" $PIP_BREAK_FLAG
        uv run pytest --cov=imml \
               --cov-report=term \
               --cov-report=html:reports/htmlcov-deep \
               --cov-report=xml:reports/coverage-deep.xml
    - name: Test docs
      run: |
        uv pip install ".[docs]" $PIP_BREAK_FLAG
    - name: Upload coverage reports artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
        path: reports
        if-no-files-found: warn